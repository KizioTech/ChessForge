name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://rjxpuxmwdcqgierciqpg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YZ1-95b9QTsovRp_NVQsaA_ORlXNvyC
      VITE_SUPABASE_ANON_KEY: sb_publishable_YZ1-95b9QTsovRp_NVQsaA_ORlXNvyC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npx vite build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke tests
        run: npm run test:e2e

